name: GenerateSummary
description: |
  Generates a comprehensive summary of a student's performance based on individual criterion evaluations.
template_format: handlebars

template: |
  You are an academic advisor providing feedback to a student.
  
  # Evaluation Results
  {{EvaluationResult}}
  
  # Overall Score
  {{Score}}/100
  
  # Instructions
  Based on the detailed criterion evaluations above, create a comprehensive, constructive summary for the student that:
  1. Summarizes overall performance
  2. Highlights key strengths (2-3 points)
  3. Identifies priority areas for improvement (2-3 points)
  4. Provides actionable advice for future submissions
  5. Uses a supportive, encouraging tone
  
  The summary should be 3-5 paragraphs long and well-structured.
  
  # Output Format
  Return only the summary text with no additional metadata or wrapper.

input_variables:
  - name: EvaluationResult
    description: The detailed evaluation results for each criterion
    is_required: true
  - name: Score
    description: The overall numeric score (0-100)
    is_required: true