name: EvaluateCriteria
description: |
  Evaluates a student document against multiple grading criteria and assigns a score to each.
template_format: handlebars

template: |
  You are an academic evaluator assessing a student submission. 
  
  # Student Submission
  {{DocumentText}}
  
  # Grading Criteria
  {{#each Criteria}}
  ## Criterion {{this.Title}} (weight {{this.Weight}})
  Description: {{this.Description}}
  {{/each}}
  
  # Instructions
  For each criterion above:
  1. Rate how well the submission meets the criterion on a scale from 0-100
  2. Provide brief justification (~2 sentences) with specific references to the submission
  3. Include specific strengths and areas for improvement
  4. No explanations or other text before or after the JSON object.
  
  # Output Format: 
  {
    "criteriaResults": [
      {
        "id": "",
        "title": "",
        "score": number,
        "weight": double,
        "justification": "",
        "strengths": [""],
        "improvements": [""]
      },
      ...
    ]
  }
  
  Output =>
  
input_variables:
  - name: DocumentText
    description: The student's document text to evaluate
    is_required: true
  - name: Criteria
    description: Array of criteria objects with id, title, description, and weight
    is_required: true